name: SmartLedger
options:
  bundleIdPrefix: com.tok
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  settings:
    base:
      SWIFT_VERSION: 6.0
      DEVELOPMENT_TEAM: ""
      CODE_SIGN_STYLE: Automatic
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: 1.0.0
targets:
  SmartLedger:
    type: application
    platform: iOS
    sources:
      - path: SmartLedger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tok.smartledgerlocal
        PRODUCT_NAME: SmartLedger
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        GENERATE_INFOplist_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SmartLedger
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 需要读取账单截图用于 OCR 识别记账内容。
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        IPHONEOS_DEPLOYMENT_TARGET: 17.0
        CODE_SIGN_ENTITLEMENTS: SmartLedger/SmartLedger.entitlements
    scheme:
      testTargets:
        - SmartLedgerTests

  SmartLedgerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SmartLedgerTests
    dependencies:
      - target: SmartLedger
    settings:
      base:
        GENERATE_INFOplist_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.tok.smartledgerlocal.tests
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: TESTING
